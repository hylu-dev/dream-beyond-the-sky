<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dream Beyond the Sky</title>
    <meta name="description" content="A cinematic flight through clouds and ruins, from a dream on a floating island." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <!-- Added to an iPhone's Home Screen, it opens without Safari's bars. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dream" />
    <!-- Link previews. Crawlers need the image's full address. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dream.hylu.dev/" />
    <meta property="og:title" content="Dream Beyond the Sky · 梦越苍穹" />
    <meta property="og:description" content="A cinematic flight through clouds and ruins, from a dream on a floating island." />
    <meta property="og:image" content="https://dream.hylu.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0b0d16;
        --paper: #efe6d2;
        --gold: #c9a45c;
        --gold-dim: rgba(201, 164, 92, 0.45);
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      /* Held touches steer, so they mustn't select text or call up menus. */
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
      #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #fade {
        position: fixed; inset: 0; background: #fff; opacity: 0;
        pointer-events: none;
      }
      /* Black over the scene while it loads - so nothing shows before she is
         placed and posed - lifted once the first shot is set up. */
      #curtain {
        position: fixed; inset: 0; z-index: 3; background: #000;
        pointer-events: none; transition: opacity 1.6s ease;
      }
      #curtain.up { opacity: 0; }
      #curtain.quick { transition-duration: 0.4s; }
      /* While it loads, the title is the menu's own (#menu.booting, below):
         and where Start will be, a hairline that fills with gold to a glowing
         point (--p, 0..1), set by main.js. */
      #loading {
        position: absolute; left: 0; top: 0; bottom: 0; width: min(180px, 40vw);
        display: flex; flex-direction: column; justify-content: center; align-items: flex-start; pointer-events: none;
      }
      /* Over the menu's own rules for the pieces of .actions: shown only
         while it loads, never when the menu comes back. */
      #menu #loading { opacity: 0; transform: none; filter: none; transition: opacity 0.9s ease; }
      :is(#loading, #flight-loading) .load-bar {
        position: relative; width: 100%; height: 1px;
        background: linear-gradient(to right, rgba(239, 230, 210, 0.16), rgba(239, 230, 210, 0.16) 80%, transparent);
        animation: load-in 1.6s ease 0.7s both;
      }
      :is(#loading, #flight-loading) .load-bar span {
        position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--p, 0));
        background: linear-gradient(to right, rgba(201, 164, 92, 0.35), var(--gold));
      }
      :is(#loading, #flight-loading) .load-bar::after {
        content: ''; position: absolute; top: 50%; left: calc(var(--p, 0) * 100%);
        width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
        background: rgb(236, 206, 140); box-shadow: 0 0 10px 3px rgba(226, 190, 118, 0.55);
        opacity: min(1, calc(var(--p, 0) * 20));
      }
      :is(#loading, #flight-loading) .load-label {
        margin-top: 14px; font: 500 11px/1 'Cormorant Garamond', serif;
        letter-spacing: 0.3em; text-transform: uppercase; color: rgba(201, 164, 92, 0.6);
        animation: load-in 1.6s ease 0.9s both, load-breathe 2.8s ease-in-out 2.5s infinite;
      }
      /* The same bar at the foot of the frame, by where "Hold to skip" shows,
         while the story waits on the flight's assets: at the brink, or on a
         full skip ring. */
      #flight-loading {
        position: fixed; z-index: 4; right: calc(clamp(20px, 4vw, 56px) + env(safe-area-inset-right));
        bottom: calc(7vh + 18px + env(safe-area-inset-bottom)); width: min(140px, 30vw);
        display: flex; flex-direction: column; align-items: flex-start; pointer-events: none;
        opacity: 0; transition: opacity 0.9s ease;
      }
      #flight-loading.show { opacity: 1; }
      /* Over the dawn sky, not the night: lifted like the skip prompt. */
      #flight-loading .load-label { margin-top: 10px; color: rgba(239, 230, 210, 0.82); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5); }
      #flight-loading .load-bar { box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35); }
      @keyframes load-in { from { opacity: 0; transform: translateY(6px); filter: blur(3px); } }
      @keyframes load-breathe { 50% { opacity: 0.45; } }

      /* On a phone held upright: everything waits under a night-blue sheet
         asking for it to be turned on its side. */
      #rotate {
        position: fixed; inset: 0; z-index: 10; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
        text-align: center; background: #0b0d18; color: var(--paper);
      }
      #rotate svg { width: 46px; height: 46px; color: rgba(201, 164, 92, 0.85); animation: rotate-hint 2.8s cubic-bezier(0.5, 0, 0.3, 1) infinite; }
      #rotate .zh { font: 300 22px/1 'Noto Serif SC', serif; letter-spacing: 0.3em; padding-left: 0.3em; }
      #rotate .en {
        font: 500 12px/1.6 'Cormorant Garamond', serif; letter-spacing: 0.32em; padding-left: 0.32em;
        text-transform: uppercase; color: rgba(239, 230, 210, 0.7);
      }
      /* A load that failed, or a lost graphics device: the same night-blue
         sheet, and a tap to start again. */
      #failed {
        position: fixed; inset: 0; z-index: 11; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
        text-align: center; background: #0b0d18; color: var(--paper);
      }
      #failed.show { display: flex; }
      #failed .zh { font: 300 22px/1 'Noto Serif SC', serif; letter-spacing: 0.3em; padding-left: 0.3em; }
      #failed .en {
        font: 500 12px/1.6 'Cormorant Garamond', serif; letter-spacing: 0.32em; padding-left: 0.32em;
        text-transform: uppercase; color: rgba(239, 230, 210, 0.7);
      }
      #failed button {
        margin-top: 6px; padding: 10px 22px; border: 1px solid var(--gold-dim); background: none; color: var(--gold);
        font: 600 13px/1 'Cormorant Garamond', serif; letter-spacing: 0.34em; padding-left: calc(22px + 0.34em);
        text-transform: uppercase; cursor: pointer;
      }
      @keyframes rotate-hint { 0%, 20% { transform: rotate(0); } 50%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }

      /* ── Hold to skip: shows while the pointer (mouse or finger) is held
         during a cutscene, its ring filling until the scene skips to the
         flight. ── */
      #skip {
        position: fixed; right: calc(clamp(20px, 4vw, 56px) + env(safe-area-inset-right)); bottom: calc(7vh + 18px + env(safe-area-inset-bottom)); z-index: 4;
        display: flex; align-items: center; gap: 10px; pointer-events: none;
        color: rgba(239, 230, 210, 0.82); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
        font: 500 12px/1 'Cormorant Garamond', serif; letter-spacing: 0.3em; text-transform: uppercase;
        opacity: 0; transition: opacity 0.4s ease;
      }
      #skip.show { opacity: 1; }
      #skip svg { width: 22px; height: 22px; transform: rotate(-90deg); }
      #skip circle { fill: none; stroke-width: 1.5; }
      #skip .track { stroke: rgba(239, 230, 210, 0.22); }
      #skip .fill { stroke: var(--gold); stroke-dasharray: 56.55; stroke-dashoffset: calc(56.55 * (1 - var(--p, 0))); }
      #hint {
        position: fixed; z-index: 4; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
        color: rgba(239, 230, 210, 0.55); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
        font: 500 12px/1.4 'Cormorant Garamond', serif; letter-spacing: 0.3em; text-transform: uppercase;
        pointer-events: none;
      }
      #hint:empty { display: none; }

      /* ── The flight's controls - steer toward the pointer, or hold where
         to go - clear at the foot of the frame until she is first
         steered, then gone. ── */
      #controls {
        position: fixed; left: 50%; bottom: calc(6vh + env(safe-area-inset-bottom)); z-index: 1; transform: translate(-50%, 6px);
        display: flex; align-items: center; gap: 10px; padding: 12px 22px;
        color: var(--paper); pointer-events: none; opacity: 0;
        transition: opacity 0.9s ease, transform 0.9s ease;
      }
      #controls::before {
        content: ''; position: absolute; inset: -14px -40px; z-index: -1;
        background: radial-gradient(closest-side, rgba(12, 8, 18, 0.45), transparent);
      }
      #controls.show { opacity: 1; transform: translate(-50%, 0); transition-delay: 0.8s; }
      #controls svg { width: 64px; height: 44px; flex: none; overflow: visible; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #controls .arrow { stroke: rgba(201, 164, 92, 0.85); stroke-width: 1.6; }
      #controls .mouse, #controls .touch { stroke: var(--paper); stroke-width: 1.4; }
      #controls .finger { stroke: var(--paper); stroke-width: 1.4; fill: rgba(239, 230, 210, 0.18); display: none; }
      /* the mouse (or a fingertip) wanders round: side to side, up and down */
      #controls .glyph { animation: steer-sway 4s ease-in-out infinite; }
      @keyframes steer-sway {
        0%, 100% { transform: translate(-9px, 0); } 25% { transform: translate(0, -5px); }
        50% { transform: translate(9px, 0); } 75% { transform: translate(0, 5px); }
      }
      #controls .by-touch { display: none; }
      @media (pointer: coarse) {
        #controls .mouse, #controls .touch, #controls .by-mouse { display: none; }
        #controls .finger { display: inline; }
        #controls .by-touch { display: inline; }
      }
      #controls span {
        margin-left: 10px; font: 600 17px/1 'Cormorant Garamond', serif; letter-spacing: 0.34em;
        text-transform: uppercase; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55); white-space: nowrap;
      }
      @media (max-width: 720px), (max-height: 480px) {
        #controls { bottom: calc(5vh + env(safe-area-inset-bottom)); }
        #controls span { font-size: 13px; letter-spacing: 0.26em; }
      }

      /* ── Over the scene: a vignette, film grain, and the letterbox that
         closes in once the story starts. ── */
      #vignette, #grain { position: fixed; inset: 0; pointer-events: none; }
      #vignette { background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(4, 4, 10, 0.42)); }
      #grain {
        opacity: 0.07; mix-blend-mode: overlay; animation: grain 0.6s steps(4) infinite;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      @keyframes grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-3%, 2%); } 50% { transform: translate(2%, -3%); } 75% { transform: translate(-2%, -1%); } }
      /* The fall's dread (crash.js): the dark closing in from the frame's
         edges, its clear middle (--clear) narrowing, on a long soft falloff
         so it never shows an edge. */
      #dread {
        position: fixed; inset: 0; pointer-events: none; opacity: 0; --clear: 60%;
        background: radial-gradient(ellipse farthest-corner at 50% 50%, transparent var(--clear),
          rgba(24, 2, 6, 0.3) calc(var(--clear) + (100% - var(--clear)) * 0.4),
          rgba(14, 1, 4, 0.7) calc(var(--clear) + (100% - var(--clear)) * 0.75), rgba(6, 0, 2, 0.92) 100%);
      }
      /* Black over everything but the curtain, opening from the middle as
         two straight edges parting: --shut 0 open, 1 shut. */
      #lids { position: fixed; inset: 0; z-index: 2; pointer-events: none; --shut: 0; }
      #lids .lid { position: absolute; left: 0; right: 0; height: 50.5vh; background: #000; }
      #lids .lid.top { top: 0; transform: translateY(calc((var(--shut) - 1) * 100%)); }
      #lids .lid.bottom { bottom: 0; transform: translateY(calc((1 - var(--shut)) * 100%)); }
      /* Over the white flash, so the bars stay black through it. */
      .bar { position: fixed; left: 0; right: 0; z-index: 2; height: 7vh; background: #050508; pointer-events: none; transition: transform 2.4s cubic-bezier(0.6, 0, 0.2, 1); }
      .bar.top { top: 0; transform: translateY(-100%); }
      .bar.bottom { bottom: 0; transform: translateY(100%); }
      body.cinema .bar { transform: none; }

      /* ── The area's title as the flight begins: the name tracks in out of a
         blur under a gold rule drawn from the middle, holds, and drifts off -
         small and high, so the flight stays the subject. ── */
      #area {
        position: fixed; left: 0; right: 0; top: 11vh; z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        padding: 0 16px; color: var(--paper); text-align: center;
        pointer-events: none; opacity: 0;
      }
      #area::before {
        /* a faint ink wash so it reads against the bright sky */
        content: ''; position: absolute; left: 50%; top: 50%; z-index: -1;
        width: min(560px, 100vw); height: 240%; transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, rgba(16, 10, 24, 0.42), rgba(16, 10, 24, 0.18) 60%, transparent);
      }
      .area-en {
        font: 600 clamp(14px, 1.45vw, 20px)/1 'Cormorant Garamond', serif;
        letter-spacing: 0.36em; padding-left: 0.36em; text-transform: uppercase;
        color: #f6efe0;
        text-shadow: 0 0 12px rgba(20, 10, 4, 0.85), 0 0 4px rgba(20, 10, 4, 0.7), 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .area-rule { display: flex; align-items: center; gap: 8px; width: min(220px, 56vw); opacity: 0.85; }
      .area-rule::before, .area-rule::after { content: ''; flex: 1; height: 1px; transform: scaleX(0); }
      .area-rule::before { background: linear-gradient(to left, var(--gold), transparent); transform-origin: right; }
      .area-rule::after { background: linear-gradient(to right, var(--gold), transparent); transform-origin: left; }
      .area-rule span { width: 4px; height: 4px; border: 1px solid var(--gold); transform: rotate(45deg); opacity: 0; }
      .area-zh {
        font: 600 clamp(26px, 3.4vw, 46px)/1.15 'Noto Serif SC', 'Shippori Mincho B1', serif;
        letter-spacing: 0.42em; padding-left: 0.42em; color: #f6efe0;
        text-shadow: 0 0 18px rgba(24, 12, 4, 0.65), 0 0 4px rgba(24, 12, 4, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      #area.play { animation: area 6.5s ease forwards; }
      #area.play .area-zh { animation: area-zh 6.5s cubic-bezier(0.2, 0.6, 0.2, 1) forwards; }
      #area.play .area-en { animation: area-en 6.5s ease forwards; }
      #area.play .area-rule::before, #area.play .area-rule::after { animation: area-rule 6.5s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      #area.play .area-rule span { animation: area-en 6.5s ease forwards; }
      @keyframes area { 0% { opacity: 0; } 10% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes area-zh {
        0% { opacity: 0; letter-spacing: 0.7em; padding-left: 0.7em; filter: blur(8px); }
        34% { opacity: 1; letter-spacing: 0.42em; padding-left: 0.42em; filter: blur(0); }
        84% { opacity: 1; transform: none; filter: blur(0); }
        100% { opacity: 0; transform: translateY(-6px); filter: blur(5px); }
      }
      @keyframes area-en {
        0%, 16% { opacity: 0; transform: translateY(4px); filter: blur(3px); }
        36% { opacity: 1; transform: none; filter: blur(0); }
        84% { opacity: 1; transform: none; filter: blur(0); }
        100% { opacity: 0; transform: translateY(-4px); filter: blur(3px); }
      }
      @keyframes area-rule { 0%, 12% { transform: scaleX(0); } 40% { transform: scaleX(1); } 100% { transform: scaleX(1); } }

      /* ── Title menu: a vertical title and, beside it on a hairline as tall
         as it, the English name and Start under it - kept quiet: thin type,
         no fills, so the night is the picture. ── */
      #menu {
        position: fixed; inset: 0; display: flex; justify-content: flex-end; align-items: center;
        pointer-events: none; opacity: 0; visibility: hidden;
        transition: opacity 1.4s ease, visibility 0s linear 1.4s;
      }
      #menu.show { opacity: 1; visibility: visible; transition: opacity 1.6s ease; }
      #menu.leaving { opacity: 0; visibility: hidden; transition: opacity 1.1s ease, visibility 0s linear 1.1s; }
      #menu::before {
        /* an ink wash behind the panel, fading out toward her */
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(ellipse 46% 74% at 100% 50%, rgba(6, 8, 16, 0.42), rgba(6, 8, 16, 0.16) 50%, transparent 78%);
      }
      .panel {
        position: relative; z-index: 1; margin-right: calc(clamp(32px, 10vw, 160px) + env(safe-area-inset-right));
        display: flex; align-items: stretch; gap: 26px; color: var(--paper);
      }
      .title-v {
        margin: 0; writing-mode: vertical-rl; text-orientation: upright;
        font: 300 clamp(22px, 2.4vw, 32px)/1 'Noto Serif SC', 'Shippori Mincho B1', serif;
        letter-spacing: 0.14em; color: rgba(239, 230, 210, 0.9);
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.45);
      }
      .side {
        position: relative; display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
        gap: 22px; padding: 4px 0 4px 24px;
      }
      .side::before {
        /* the hairline, fading out at both ends */
        content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px;
        background: linear-gradient(to bottom, transparent, rgba(201, 164, 92, 0.4) 18%, rgba(201, 164, 92, 0.4) 82%, transparent);
      }
      .actions { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
      .title-en {
        font: 500 clamp(12px, 1.05vw, 15px)/2 'Cormorant Garamond', serif;
        letter-spacing: 0.32em; text-transform: uppercase; color: rgba(239, 230, 210, 0.72);
      }
      #start {
        pointer-events: auto; cursor: pointer;
        position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: 12px;
        padding: 6px 0 8px; border: 0; background: none; color: rgba(239, 230, 210, 0.78);
        font: 500 14px/1 'Cormorant Garamond', serif; letter-spacing: 0.4em; text-transform: uppercase;
        transition: color 0.4s ease, letter-spacing 0.6s cubic-bezier(0.2, 0.6, 0.2, 1), text-shadow 0.4s ease;
      }
      /* a warm glow behind it that comes up on hover */
      #start::before {
        content: ''; position: absolute; left: -22px; right: -14px; top: -10px; bottom: -10px; z-index: -1;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(201, 164, 92, 0.22), transparent 72%);
        opacity: 0; transition: opacity 0.5s ease;
      }
      /* a hairline under it that draws out on hover */
      #start::after {
        content: ''; position: absolute; left: 0; right: 0.4em; bottom: 0; height: 1px;
        background: linear-gradient(to right, var(--gold-dim), transparent);
        transform: scaleX(0.35); transform-origin: left; transition: transform 0.6s cubic-bezier(0.2, 0.6, 0.2, 1);
      }
      #start .kanji { font: 400 14px/1 'Noto Serif SC', serif; letter-spacing: 0; color: rgba(201, 164, 92, 0.75); transition: color 0.4s ease, text-shadow 0.4s ease; }
      #start:hover, #start:focus-visible { color: var(--paper); letter-spacing: 0.5em; text-shadow: 0 0 14px rgba(255, 220, 160, 0.55); }
      #start:hover .kanji, #start:focus-visible .kanji { color: rgb(226, 190, 118); text-shadow: 0 0 12px rgba(226, 190, 118, 0.8); }
      #start:hover::before, #start:focus-visible::before { opacity: 1; }
      #start:hover::after, #start:focus-visible::after { transform: scaleX(1); background: linear-gradient(to right, rgba(226, 190, 118, 0.9), transparent); }
      #start:focus-visible { outline: none; }
      .foot {
        font: 500 11px/1 'Cormorant Garamond', serif; letter-spacing: 0.3em; text-transform: uppercase;
        color: rgba(201, 164, 92, 0.45);
      }
      /* Each piece comes in on its own beat. */
      .panel > *, .side > *, .actions > * { opacity: 0; transform: translateY(8px); filter: blur(3px); transition: opacity 1.2s ease, transform 1.2s ease, filter 1.2s ease; }
      .side > .actions { opacity: 1; transform: none; filter: none; }
      #menu.show .panel > *, #menu.show .side > *, #menu.show .actions > * { opacity: 1; transform: none; filter: none; }
      #menu.show .title-v { transition-delay: 0.3s; }
      #menu.show .side { transition-delay: 0.7s; }
      #menu.show .title-en { transition-delay: 0.9s; }
      #menu.show #start { transition: opacity 1.2s ease 1.4s, transform 1.2s ease 1.4s, filter 1.2s ease 1.4s, color 0.4s ease, letter-spacing 0.6s cubic-bezier(0.2, 0.6, 0.2, 1), text-shadow 0.4s ease; }
      #menu.show #start:hover { transition: color 0.4s ease, letter-spacing 0.6s cubic-bezier(0.2, 0.6, 0.2, 1), text-shadow 0.4s ease; }
      #menu.show .foot { transition-delay: 1.9s; }
      /* On Start the panel fades out whole. */
      #menu.leaving .panel > *, #menu.leaving .side > *, #menu.leaving .actions > * { opacity: 1; transform: none; filter: none; }
      /* Loading: the panel shows over the black curtain from the first frame,
         its title coming in as the loading screen's; Start and its hint wait
         under the bar. Once loaded only the bar gives way to Start - the
         title never leaves, and the scene comes up behind it. */
      #menu.booting { z-index: 4; opacity: 1; visibility: visible; transition: none; }
      #menu.booting .title-v, #menu.booting .side, #menu.booting .title-en { opacity: 1; transform: none; filter: none; transition: none; animation: load-in 1.6s ease both; }
      #menu.booting .side { animation-delay: 0.3s; }
      #menu.booting .title-en { animation-delay: 0.5s; }
      /* Fullscreen, in the menu's top right corner where the browser allows
         it (main.js hides it elsewhere, as on an iPhone). */
      #fullscreen {
        position: absolute; z-index: 1; top: calc(18px + env(safe-area-inset-top)); right: calc(18px + env(safe-area-inset-right));
        display: flex; padding: 12px; border: 0; background: none;
        color: rgba(239, 230, 210, 0.38); cursor: pointer; pointer-events: auto;
        filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.5)); transition: color 0.4s ease, opacity 0.9s ease;
      }
      #fullscreen[hidden] { display: none; }
      #fullscreen svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
      #fullscreen .exit, #fullscreen.on .enter { display: none; }
      #fullscreen.on .exit { display: inline; }
      #fullscreen:hover, #fullscreen:focus-visible { color: var(--paper); outline: none; }
      #menu.booting #fullscreen, #menu.waiting #fullscreen { opacity: 0; pointer-events: none; }
      #menu.booting #start, #menu.booting .foot { opacity: 0; transform: translateY(8px); filter: blur(3px); transition: none; }
      #menu.booting #start { pointer-events: none; }
      #menu.booting #loading { opacity: 1; }
      /* And stays over the curtain while it lifts, so the title never drops
         behind the black on the way into the menu. */
      #menu.unveiling { z-index: 4; }
      /* Coming home after the ending, the panel returns while the camera is
         still moving; Start and its hint wait until it can be pressed. */
      #menu.waiting #start, #menu.waiting .foot { opacity: 0; transform: translateY(8px); filter: blur(3px); transition: none; }
      #menu.waiting #start { pointer-events: none; }
      @media (max-width: 720px) {
        #menu { align-items: flex-end; }
        .panel { margin: 0 calc(20px + env(safe-area-inset-right)) calc(14vh + env(safe-area-inset-bottom)) auto; gap: 18px; }
        .title-v { font-size: 24px; }
        .side { padding-left: 18px; gap: 18px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate svg, #controls .glyph, #loading *, #flight-loading *, #menu.booting .panel * { animation: none; }
        #grain { animation: none; }
        #area.play .area-zh, #area.play .area-en, #area.play .area-rule span { animation: none; }
        #area.play .area-rule::before, #area.play .area-rule::after { animation: none; transform: none; }
        .area-rule span { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="curtain"></div>
    <div id="rotate" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="1.8" /><path d="M10.5 18.5h3" />
      </svg>
      <div class="zh" lang="zh-Hans">请横屏</div>
      <div class="en">Turn your device to landscape</div>
    </div>
    <div id="flight-loading" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="load-bar"><span></span></div>
      <div class="load-label">Loading</div>
    </div>
    <div id="failed" role="alert">
      <div class="zh" lang="zh-Hans">梦未能载入</div>
      <div class="en">The dream couldn't load</div>
      <button type="button">Try again</button>
    </div>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="dread"></div>
    <div class="bar top"></div>
    <div class="bar bottom"></div>
    <div id="lids" aria-hidden="true"><div class="lid top"></div><div class="lid bottom"></div></div>
    <div id="menu" class="booting" aria-hidden="true">
      <button id="fullscreen" type="button" hidden aria-label="Fullscreen" title="Fullscreen (F)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path class="enter" d="M9.5 6.5l5-5M10.5 1.5h4v4M6.5 9.5l-5 5M5.5 14.5h-4v-4" />
          <path class="exit" d="M14.5 1.5l-5 5M9.5 2.5v4h4M1.5 14.5l5-5M6.5 13.5v-4h-4" />
        </svg>
      </button>
      <div class="panel">
        <h1 class="title-v" lang="zh-Hans">梦越苍穹</h1>
        <div class="side">
          <div class="title-en">Dream Beyond<br /> the Sky</div>
          <div class="actions">
            <button id="start" type="button"><span class="kanji" lang="zh-Hans">启</span>Start</button>
            <div class="foot">Press Enter</div>
            <div id="loading" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="load-bar"><span></span></div>
              <div class="load-label">Loading</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="area" aria-label="Where Clouds Sleep — 云眠之处">
      <div class="area-en">Where Clouds Sleep</div>
      <div class="area-rule"><span></span></div>
      <div class="area-zh" lang="zh-Hans">云眠之处</div>
    </div>
    <div id="skip" aria-hidden="true">
      <svg viewBox="0 0 22 22"><circle class="track" cx="11" cy="11" r="9" /><circle class="fill" cx="11" cy="11" r="9" /></svg>
      <span>Hold to skip</span>
    </div>
    <div id="controls" aria-hidden="true">
      <svg viewBox="0 0 64 44" aria-hidden="true">
        <path class="arrow" d="M9 17l-5 5 5 5" /><path class="arrow" d="M55 17l5 5-5 5" />
        <path class="arrow" d="M27 6l5-5 5 5" /><path class="arrow" d="M27 38l5 5 5-5" />
        <g class="glyph"><rect class="mouse" x="25" y="11" width="14" height="22" rx="7" /><path class="touch" d="M32 12v6" /><circle class="finger" cx="32" cy="22" r="6" /></g>
      </svg>
      <span class="by-mouse">Move the mouse to steer</span><span class="by-touch">Hold where you want to fly</span>
    </div>
    <div id="fade"></div>
    <div id="hint"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
