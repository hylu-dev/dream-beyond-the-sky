<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splat Scene Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Yuji+Syuku&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0b0d16;
        --paper: #efe6d2;
        --gold: #c9a45c;
        --gold-dim: rgba(201, 164, 92, 0.45);
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #fade {
        position: fixed; inset: 0; background: #fff; opacity: 0;
        pointer-events: none;
      }
      #hint {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
        padding: 8px 14px; border-radius: 8px;
        background: rgba(0, 0, 0, 0.55); color: #fff;
        font: 14px/1.4 system-ui, sans-serif; pointer-events: none;
      }
      #hint:empty { display: none; }

      /* ── Over the scene: a vignette, film grain, and the letterbox that
         closes in once the story starts. ── */
      #vignette, #grain { position: fixed; inset: 0; pointer-events: none; }
      #vignette { background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(4, 4, 10, 0.42)); }
      #grain {
        opacity: 0.07; mix-blend-mode: overlay; animation: grain 0.6s steps(4) infinite;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      @keyframes grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-3%, 2%); } 50% { transform: translate(2%, -3%); } 75% { transform: translate(-2%, -1%); } }
      /* Over the white flash, so the bars stay black through it. */
      .bar { position: fixed; left: 0; right: 0; z-index: 2; height: 7vh; background: #050508; pointer-events: none; transition: transform 2.4s cubic-bezier(0.6, 0, 0.2, 1); }
      .bar.top { top: 0; transform: translateY(-100%); }
      .bar.bottom { bottom: 0; transform: translateY(100%); }
      body.cinema .bar { transform: none; }

      /* ── The area's title as the flight begins: the name tracks in out of a
         blur under a gold rule drawn from the middle, holds, and drifts off. ── */
      #area {
        position: fixed; left: 0; right: 0; top: 14vh; z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 16px;
        padding: 0 16px; color: var(--paper); text-align: center;
        pointer-events: none; opacity: 0;
      }
      #area::before {
        /* a faint ink wash so it reads against the bright sky */
        content: ''; position: absolute; left: 50%; top: 50%; z-index: -1;
        width: min(820px, 100vw); height: 260%; transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, rgba(16, 10, 24, 0.34), transparent);
      }
      .area-en {
        font: 600 clamp(14px, 1.7vw, 22px)/1 'Cormorant Garamond', serif;
        letter-spacing: 0.52em; padding-left: 0.52em; text-transform: uppercase;
        color: rgba(239, 230, 210, 0.95); text-shadow: 0 0 18px rgba(30, 16, 8, 0.55);
      }
      .area-rule { display: flex; align-items: center; gap: 10px; width: min(360px, 72vw); }
      .area-rule::before, .area-rule::after { content: ''; flex: 1; height: 1px; transform: scaleX(0); }
      .area-rule::before { background: linear-gradient(to left, var(--gold), transparent); transform-origin: right; }
      .area-rule::after { background: linear-gradient(to right, var(--gold), transparent); transform-origin: left; }
      .area-rule span { width: 5px; height: 5px; border: 1px solid var(--gold); transform: rotate(45deg); opacity: 0; }
      .area-zh {
        font: 600 clamp(38px, 6vw, 84px)/1.15 'Noto Serif SC', 'Shippori Mincho B1', serif;
        letter-spacing: 0.42em; padding-left: 0.42em;
        text-shadow: 0 0 30px rgba(40, 20, 4, 0.5), 0 2px 2px rgba(0, 0, 0, 0.3);
      }
      #area.play { animation: area 8s ease forwards; }
      #area.play .area-zh { animation: area-zh 8s cubic-bezier(0.2, 0.6, 0.2, 1) forwards; }
      #area.play .area-en { animation: area-en 8s ease forwards; }
      #area.play .area-rule::before, #area.play .area-rule::after { animation: area-rule 8s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      #area.play .area-rule span { animation: area-en 8s ease forwards; }
      @keyframes area { 0% { opacity: 0; } 8% { opacity: 1; } 84% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes area-zh {
        0% { opacity: 0; letter-spacing: 0.8em; padding-left: 0.8em; filter: blur(10px); }
        34% { opacity: 1; letter-spacing: 0.42em; padding-left: 0.42em; filter: blur(0); }
        84% { opacity: 1; transform: none; filter: blur(0); }
        100% { opacity: 0; transform: translateY(-10px); filter: blur(6px); }
      }
      @keyframes area-en {
        0%, 16% { opacity: 0; transform: translateY(6px); filter: blur(4px); }
        36% { opacity: 1; transform: none; filter: blur(0); }
        84% { opacity: 1; transform: none; filter: blur(0); }
        100% { opacity: 0; transform: translateY(-6px); filter: blur(4px); }
      }
      @keyframes area-rule { 0%, 12% { transform: scaleX(0); } 40% { transform: scaleX(1); } 100% { transform: scaleX(1); } }

      /* ── Title menu: a vertical title, one line, and Start on the right ── */
      #menu {
        position: fixed; inset: 0; display: flex; justify-content: flex-end; align-items: center;
        pointer-events: none; opacity: 0; visibility: hidden;
        transition: opacity 1.4s ease, visibility 0s linear 1.4s;
      }
      #menu.show { opacity: 1; visibility: visible; transition: opacity 1.6s ease; }
      #menu.leaving { opacity: 0; visibility: hidden; transition: opacity 1.1s ease, visibility 0s linear 1.1s; }
      #menu::before {
        /* an ink wash behind the panel, fading out toward her */
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(ellipse 50% 80% at 100% 50%, rgba(6, 8, 16, 0.7), rgba(6, 8, 16, 0.3) 50%, transparent 78%);
      }
      .panel {
        position: relative; z-index: 1; margin-right: clamp(32px, 10vw, 160px);
        display: flex; align-items: center; gap: 30px; color: var(--paper);
      }
      .title-v {
        margin: 0; writing-mode: vertical-rl; text-orientation: upright;
        font: 400 clamp(44px, 5.6vw, 72px)/1 'Yuji Syuku', 'Shippori Mincho B1', serif;
        letter-spacing: 0.16em;
        text-shadow: 0 0 24px rgba(0, 0, 0, 0.6), 0 2px 1px rgba(0, 0, 0, 0.4);
      }
      .side { display: flex; flex-direction: column; align-items: flex-start; gap: 26px; padding-left: 26px; border-left: 1px solid var(--gold-dim); }
      .title-en {
        font: 600 clamp(15px, 1.4vw, 19px)/1.3 'Cormorant Garamond', serif;
        letter-spacing: 0.32em; text-transform: uppercase; color: rgba(239, 230, 210, 0.92);
      }
      #start {
        pointer-events: auto; cursor: pointer;
        display: inline-flex; align-items: center; gap: 12px;
        padding: 11px 26px 11px 14px; border: 1px solid var(--gold); border-radius: 2px;
        background: rgba(126, 29, 24, 0.82); color: #f8ecd9;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
        font: 600 16px/1 'Cormorant Garamond', serif; letter-spacing: 0.34em; text-transform: uppercase;
        transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
      }
      #start .kanji { font: 700 18px/1 'Shippori Mincho B1', serif; letter-spacing: 0; color: var(--gold); }
      #start:hover, #start:focus-visible { transform: translateY(-2px); background: rgba(184, 50, 42, 0.92); box-shadow: 0 0 0 5px rgba(201, 164, 92, 0.16), 0 12px 26px rgba(0, 0, 0, 0.45); }
      #start:focus-visible { outline: 1px solid var(--gold); outline-offset: 5px; }
      #start:active { transform: translateY(1px); }
      .foot {
        font: 500 12px/1 'Cormorant Garamond', serif; letter-spacing: 0.3em; text-transform: uppercase;
        color: rgba(201, 164, 92, 0.7);
      }
      /* Each piece comes in on its own beat. */
      .panel > *, .side > * { opacity: 0; transform: translateY(8px); filter: blur(3px); transition: opacity 1.2s ease, transform 1.2s ease, filter 1.2s ease; }
      #menu.show .panel > *, #menu.show .side > * { opacity: 1; transform: none; filter: none; }
      #menu.show .title-v { transition-delay: 0.3s; }
      #menu.show .side { transition-delay: 0.7s; }
      #menu.show .title-en { transition-delay: 0.9s; }
      #menu.show #start { transition: opacity 1.2s ease 1.4s, transform 1.2s ease 1.4s, filter 1.2s ease 1.4s, background 0.25s ease, box-shadow 0.25s ease; }
      #menu.show #start:hover { transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease; }
      #menu.show .foot { transition-delay: 1.9s; }
      /* On Start the panel fades out whole. */
      #menu.leaving .panel > *, #menu.leaving .side > * { opacity: 1; transform: none; filter: none; }
      @media (max-width: 720px) {
        #menu { align-items: flex-end; }
        .panel { margin: 0 20px 14vh auto; gap: 18px; }
        .title-v { font-size: 40px; }
        .side { padding-left: 18px; gap: 20px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #grain { animation: none; }
        #area.play .area-zh, #area.play .area-en, #area.play .area-rule span { animation: none; }
        #area.play .area-rule::before, #area.play .area-rule::after { animation: none; transform: none; }
        .area-rule span { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div class="bar top"></div>
    <div class="bar bottom"></div>
    <div id="menu" aria-hidden="true">
      <div class="panel">
        <h1 class="title-v" lang="ja">浮島の社</h1>
        <div class="side">
          <div class="title-en">Floating Island Sanctuary</div>
          <button id="start" type="button"><span class="kanji" lang="ja">始</span>Start</button>
          <div class="foot">Press Enter</div>
        </div>
      </div>
    </div>
    <div id="area" aria-label="Where Clouds Rest — 云栖之境">
      <div class="area-en">Where Clouds Rest</div>
      <div class="area-rule"><span></span></div>
      <div class="area-zh" lang="zh-Hans">云栖之境</div>
    </div>
    <div id="fade"></div>
    <div id="hint">Loading…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
